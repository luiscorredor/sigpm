<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIGPM — Gestión de Producción y Mantenimiento</title>
  <link rel="stylesheet" href="variables.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <nav class="sidebar">
      <h1>S<span>I</span><span>P</span>M</h1>
      <button class="nav-btn activo" data-vista="dashboard">Panel <span class="badge oculto" id="badge-alertas">0</span></button>
      <button class="nav-btn" data-vista="maquinas">Máquinas</button>
      <button class="nav-btn" data-vista="mantenimientos">Mantenimientos</button>
      <button class="nav-btn" data-vista="productos">Productos</button>
      <button class="nav-btn" data-vista="produccion">Producción</button>
      <button class="nav-btn" data-vista="ajustes">Ajustes</button>
    </nav>

    <main class="contenido">
      <section class="vista activa" id="vista-dashboard"></section>
      <section class="vista" id="vista-maquinas"></section>
      <section class="vista" id="vista-mantenimientos"></section>
      <section class="vista" id="vista-productos"></section>
      <section class="vista" id="vista-produccion"></section>
      <section class="vista" id="vista-ajustes"></section>
    </main>
  </div>

  <div class="modal-fondo" id="modal-fondo"><div class="modal" id="modal-caja"></div></div>
  <div id="toast"></div>

  <script src="utils.js"></script>
  <script src="storage.js"></script>
  <script src="alertas.js"></script>
  <script src="ui.js"></script>
  <script src="dashboard.js"></script>
  <script src="maquinas.js"></script>
  <script src="mantenimientos.js"></script>
  <script src="productos.js"></script>
  <script src="produccion.js"></script>
  <script src="ajustes.js"></script>
  <script src="app.js"></script>
</body>
</html>
